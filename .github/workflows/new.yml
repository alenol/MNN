name: android-apk-release

# Build a signed release APK of the MnnLlmChat Android app on MANUAL trigger only.
# No automatic trigger (push/tag/schedule) — run it from the Actions tab.
#
# PATH A (zero-command on updates):
#   1. Create this workflow file via the GitHub WEB EDITOR (no CLI needed).
#   2. Commit `mnn.zip` to the repo root once (e.g. via GitHub Desktop drag-drop).
#   3. Click "Run workflow" on the Actions tab.
# On every run the workflow extracts `mnn.zip` over the checkout to overlay the
# source patches, then builds. To ship an update, just replace `mnn.zip` in the
# repo (GitHub Desktop) and run again — no git add of source files needed.
#
# NOTE: GitHub reads the workflow at job start, so a workflow change INSIDE the
# zip takes effect on the NEXT run, not the current one. Source patches apply
# immediately on every run.
on:
  workflow_dispatch:    # manual "Run workflow" from the Actions tab
    inputs:
      publish_release:
        description: 'Also publish the APK to a GitHub Release (only when run on a tag/branch with a release)'
        type: boolean
        default: false

concurrency:
  group: android-apk-release-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write   # needed to create a GitHub Release and upload assets

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    env:
      ANDROID_COMPILE_SDK: "35"
      ANDROID_BUILD_TOOLS: "35.0.0"
      ANDROID_NDK_VERSION: "27.2.12479018"
      ANDROID_CMAKE_VERSION: "3.22.1"
      KEY_ALIAS: mnnci
      KEYSTORE_PASSWORD: android
      KEY_PASSWORD: android
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # ----------------------------------------------------------------------
      # Apply the patch bundle committed at the repo root (overlay over the
      # checkout, then build). The bundle is looked up in this priority:
      #   1. mnn-2.zip  — single pre-merged bundle (recommended upload).
      #   2. mnn.zip    — single bundle (backward compatible).
      #   3. mnn1.zip, mnn2.zip, ... — split parts reassembled into mnn.zip.
      # The zip carries MNN-repo-relative paths (source patches AND this
      # workflow). If none is present, build the vanilla sources.
      # ----------------------------------------------------------------------
      - name: Apply mnn patch bundle (if present)
        run: |
          set -e
          ZIP=""
          # 1) Prefer the single pre-merged bundle.
          if [ -f "mnn-2.zip" ]; then
            ZIP="mnn-2.zip"
            echo "::notice::Found mnn-2.zip ($ZIP) — using it directly."
          # 2) Fall back to a single mnn.zip.
          elif [ -f "mnn.zip" ]; then
            ZIP="mnn.zip"
            echo "::notice::Found mnn.zip — using it directly."
          # 3) Otherwise try to reassemble split parts.
          else
            PARTS=()
            for f in $(ls mnn[0-9]*.zip 2>/dev/null | sort -t n -k 1.4 -n); do
              PARTS+=("$f")
            done
            if [ "${#PARTS[@]}" -gt 0 ]; then
              echo "::notice::Found ${#PARTS[@]} split part(s): ${PARTS[*]} — reassembling into mnn.zip."
              rm -f mnn.zip
              cat "${PARTS[@]}" > mnn.zip
              ZIP="mnn.zip"
              echo "::notice::Reassembled mnn.zip ($(wc -c < "$ZIP") bytes)."
            fi
          fi
          if [ -n "$ZIP" ]; then
            echo "::notice::Extracting $ZIP over the repository (overlay)."
            command -v unzip >/dev/null 2>&1 || (sudo apt-get update -qq && sudo apt-get install -y -qq unzip)
            unzip -o "$ZIP" -d .
            echo "::notice::Patch applied. Overwritten files:"
            unzip -l "$ZIP" | awk 'NR>3 && $4!="" {print "  - "$4}'
          else
            echo "::notice::No mnn bundle found at repo root — building with committed sources."
          fi

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install SDK packages, NDK and CMake
        run: |
          yes | sdkmanager --licenses > /dev/null || true
          sdkmanager \
            "platform-tools" \
            "platforms;android-${{ env.ANDROID_COMPILE_SDK }}" \
            "build-tools;${{ env.ANDROID_BUILD_TOOLS }}" \
            "ndk;${{ env.ANDROID_NDK_VERSION }}" \
            "cmake;${{ env.ANDROID_CMAKE_VERSION }}"

      - name: Export Android env
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "ANDROID_NDK=$ANDROID_HOME/ndk/${{ env.ANDROID_NDK_VERSION }}" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/${{ env.ANDROID_NDK_VERSION }}" >> "$GITHUB_ENV"

      # Generate an ephemeral keystore so the release APK is signed and installable.
      # Replace with your own secret-backed keystore for production releases
      # (set KEYSTORE_FILE / KEYSTORE_PASSWORD / KEY_ALIAS / KEY_PASSWORD secrets).
      - name: Generate CI signing keystore
        run: |
          KEYSTORE="$RUNNER_TEMP/mnn_release.keystore"
          keytool -genkeypair -v \
            -keystore "$KEYSTORE" \
            -alias "$KEY_ALIAS" \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass "$KEYSTORE_PASSWORD" -keypass "$KEY_PASSWORD" \
            -dname "CN=MNN, OU=CI, O=Alibaba, C=CN"
          echo "KEYSTORE_FILE=$KEYSTORE" >> "$GITHUB_ENV"

      - name: Build MNN native library (arm64-v8a)
        run: |
          cd project/android
          mkdir -p build_64
          cd build_64
          ../build_64.sh "\
            -DMNN_LOW_MEMORY=true \
            -DMNN_CPU_WEIGHT_DEQUANT_GEMM=true \
            -DMNN_BUILD_LLM=true \
            -DMNN_SUPPORT_TRANSFORMER_FUSE=true \
            -DMNN_ARM82=true \
            -DMNN_USE_LOGCAT=true \
            -DMNN_OPENCL=true \
            -DLLM_SUPPORT_VISION=true \
            -DMNN_BUILD_OPENCV=true \
            -DMNN_IMGCODECS=true \
            -DLLM_SUPPORT_AUDIO=true \
            -DMNN_BUILD_AUDIO=true \
            -DMNN_BUILD_DIFFUSION=ON \
            -DMNN_SEP_BUILD=OFF \
            -DBUILD_PLUGIN=ON \
            -DMNN_QNN=OFF \
            -DANDROID_SUPPORT_FLEXIBLE_PAGE_SIZES=ON \
            -DCMAKE_INSTALL_PREFIX=. \
            -DCMAKE_SHARED_LINKER_FLAGS='-Wl,-z,max-page-size=16384'"
          make -j"$(nproc)"
          make install

      - name: Build release APK
        working-directory: apps/Android/MnnLlmChat
        run: |
          chmod +x gradlew
          ./gradlew assembleStandardRelease --no-daemon

      - name: Locate APK
        id: apk
        working-directory: apps/Android/MnnLlmChat
        run: |
          APK=$(find app/build/outputs/apk/standard/release -name '*.apk' | head -n1)
          echo "apk=$PWD/$APK" >> "$GITHUB_OUTPUT"
          echo "Found APK: $APK"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: MnnLlmChat-standard-release
          path: ${{ steps.apk.outputs.apk }}
          if-no-files-found: error

      - name: Publish to GitHub Release
        if: ${{ github.event.inputs.publish_release == 'true' }}
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ steps.apk.outputs.apk }}
          draft: false
          prerelease: false
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
